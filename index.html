<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>JOIN THE KOALA CLUB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    /* VIDEO */
    #videoScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #kosheVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    /* TALLY */
    #formScreen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 20;

      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #formScreen.show {
      opacity: 1;
    }

    #formScreen iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>


<body>

  <!-- PRIMERO: VIDEO -->
  <div id="videoScreen">

    <video
      id="kosheVideo"
      controls
      playsinline
      preload="auto"
    >
      <source src="./video2.mp4" type="video/mp4">
    </video>

  </div>


  <!-- DESPUÉS: JOIN THE KOALA CLUB -->
  <div id="formScreen">

    <iframe
      data-tally-src="https://tally.so/r/J9E8yo?transparentBackground=1"
      width="100%"
      height="100%"
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      title="JOIN THE KOALA CLUB">
    </iframe>

  </div>


  <script src="https://tally.so/widgets/embed.js"></script>


  <script>

    const video = document.getElementById("kosheVideo");
    const videoScreen = document.getElementById("videoScreen");
    const formScreen = document.getElementById("formScreen");


    /* CUANDO TERMINA EL VIDEO */

    video.addEventListener("ended", function () {

      /* Desaparece el video */
      videoScreen.style.display = "none";

      /* Aparece Tally */
      formScreen.style.display = "block";

      /* Pequeño fade */
      setTimeout(function () {
        formScreen.classList.add("show");
      }, 50);

    });

  </script>

</body>

</html>
