<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Koshé</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* VIDEO */
    #videoScreen {
      position: relative;
      width: 100%;
      height: 100dvh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #kosheVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* BOTÓN PLAY */
    #playButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.92);
      font-size: 38px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 7px;
    }

    /* FORM */
    #formScreen {
      display: none;
      width: 100%;
      height: 100dvh;
      background: #fff;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #formScreen.show {
      opacity: 1;
    }

    #formScreen iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <div id="videoScreen">

    <video
      id="kosheVideo"
      playsinline
      preload="metadata">
      <source src="video.mp4" type="video/mp4">
      Tu navegador no puede reproducir este video.
    </video>

    <button id="playButton" aria-label="Reproducir video">
      ▶
    </button>

  </div>

  <div id="formScreen">
    <iframe
      data-tally-src="https://tally.so/r/J9E8yo?transparentBackground=1"
      width="100%"
      height="100%"
      frameborder="0"
      title="Sorteo Koshé">
    </iframe>
  </div>

  <script src="https://tally.so/widgets/embed.js"></script>

  <script>
    const video = document.getElementById("kosheVideo");
    const playButton = document.getElementById("playButton");
    const videoScreen = document.getElementById("videoScreen");
    const formScreen = document.getElementById("formScreen");

    playButton.addEventListener("click", async function () {
      try {
        await video.play();
        playButton.style.display = "none";
      } catch (error) {
        console.error("No se pudo reproducir:", error);
      }
    });

    video.addEventListener("pause", function () {
      if (!video.ended) {
        playButton.style.display = "flex";
      }
    });

    video.addEventListener("play", function () {
      playButton.style.display = "none";
    });

    video.addEventListener("ended", function () {
      videoScreen.style.display = "none";

      formScreen.style.display = "block";

      setTimeout(function () {
        formScreen.classList.add("show");
      }, 50);
    });
  </script>

</body>
</html>
