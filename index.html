<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Koshé</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    /* PANTALLA DEL VIDEO */
    #videoScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #kosheVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    /* FORMULARIO */
    #formScreen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 20;
    }

    #formScreen iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>


<body>

  <!-- VIDEO -->
  <div id="videoScreen">

    <video
      id="kosheVideo"
      controls
      playsinline
      preload="auto"
    >
      <source src="./video2.mp4" type="video/mp4">

      Tu navegador no puede reproducir este video.
    </video>

  </div>


  <!-- TALLY -->
  <div id="formScreen">

    <iframe
      src="https://tally.so/r/J9E8yo?transparentBackground=1"
      title="Sorteo Koshé"
      frameborder="0">
    </iframe>

  </div>


  <script>

    const video = document.getElementById("kosheVideo");
    const videoScreen = document.getElementById("videoScreen");
    const formScreen = document.getElementById("formScreen");

    /* CUANDO TERMINA EL VIDEO */
    video.addEventListener("ended", function () {

      videoScreen.style.display = "none";

      formScreen.style.display = "block";

    });

  </script>

</body>

</html>
