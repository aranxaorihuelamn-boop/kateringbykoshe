
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Koala Club | Koshé</title>

  <!-- TALLY SCRIPT -->
  <script async src="https://tally.so/widgets/embed.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* VIDEO */

    #video-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
      opacity: 1;
      visibility: visible;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #koshe-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #video-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* SOUND BUTTON */

    #sound-button {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 30;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      color: white;
      font-size: 15px;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    /* SKIP BUTTON */

    #skip-button {
      position: absolute;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      z-index: 30;
      padding: 12px 24px;
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 999px;
      background: rgba(0,0,0,0.45);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* PLAY BUTTON */

    #play-button {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      padding: 14px 24px;
      border: none;
      border-radius: 999px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    /* FORM */

    #form-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #form-screen.fade-in {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #form-screen iframe {
      display: block;
      width: 100%;
      min-height: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    @media (prefers-reduced-motion: reduce) {
      #video-screen,
      #form-screen {
        transition-duration: 0.01ms;
      }
    }
  </style>
</head>

<body>

  <!-- VIDEO DE BIENVENIDA -->

  <div id="video-screen">

    <video
      id="koshe-video"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="video2.mp4" type="video/mp4">
    </video>

    <button id="sound-button" aria-label="Activar sonido">
      🔊
    </button>

    <button id="play-button">
      Ver video
    </button>

    <button id="skip-button">
      Saltar video
    </button>

  </div>

  <!-- FORMULARIO DE TALLY ACTUALIZADO -->

  <div id="form-screen">
    <iframe
      data-tally-src="https://tally.so/embed/1Aee9g?dynamicHeight=1"
      loading="lazy"
      width="100%"
      height="799"
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      title="JOIN THE KOALA CLUB"
    ></iframe>
  </div>

  <!-- JAVASCRIPT -->

  <script>

    const video = document.getElementById("koshe-video");
    const videoScreen = document.getElementById("video-screen");
    const formScreen = document.getElementById("form-screen");

    const soundButton = document.getElementById("sound-button");
    const skipButton = document.getElementById("skip-button");
    const playButton = document.getElementById("play-button");

    let formShown = false;

    // CARGAR TALLY

    function loadTally() {
      const iframe = formScreen.querySelector("iframe");

      if (iframe && !iframe.src) {
        iframe.src = iframe.dataset.tallySrc;
      }

      if (typeof Tally !== "undefined") {
        Tally.loadEmbeds();
      }
    }

    // CAMBIAR DEL VIDEO AL FORMULARIO

    function showForm() {

      if (formShown) return;

      formShown = true;

      video.pause();

      loadTally();

      videoScreen.classList.add("fade-out");
      formScreen.classList.add("fade-in");

      soundButton.style.display = "none";
      skipButton.style.display = "none";
      playButton.style.display = "none";
    }

    // FINAL DEL VIDEO

    video.addEventListener("ended", showForm);

    // SALTAR VIDEO

    skipButton.addEventListener("click", showForm);

    // ACTIVAR SONIDO

    soundButton.addEventListener("click", async function() {

      try {
        video.muted = false;
        video.volume = 1;

        await video.play();

        soundButton.style.display = "none";

      } catch (error) {
        console.log("No se pudo activar el sonido.");
      }

    });

    // INTENTAR REPRODUCCIÓN AUTOMÁTICA

    async function startVideo() {

      try {
        await video.play();

      } catch (error) {
        playButton.style.display = "block";
      }

    }

    // BOTÓN VER VIDEO

    playButton.addEventListener("click", async function() {

      try {
        video.muted = true;
        await video.play();

        playButton.style.display = "none";

      } catch (error) {
        console.log("No se pudo reproducir el video.");
      }

    });

    // INICIAR

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", startVideo);
    } else {
      startVideo();
    }

  </script>

</body>
</html>
